name: Update Posts Index

on:
  push:
    paths:
      - 'posts/*.md'
      - 'scripts/update_posts.py'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate posts/index.json
        run: python scripts/update_posts.py

      - name: Commit updated posts/index.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/index.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update posts/index.json"
            git push
          fi
